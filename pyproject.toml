[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-companion"
version = "0.0.0"
description = "AI Companion V0.0 — multi-person identity, event persistence, pluggable cognition, and recoverable memory jobs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "aiosqlite>=0.19",
    "pydantic>=2.5",
    # The REPL input line is owned by prompt_toolkit on a TTY, so a proactive
    # message can be printed above live input without touching a Readline
    # buffer from another thread. Off-TTY runs fall back to plain input().
    "prompt-toolkit>=3.0,<4",
]

[project.optional-dependencies]
# dev: test tooling.  ui: the NiceGUI management web app.  web: the real HTTP
# search client. The core runtime depends only on `dependencies` above, so a
# headless install never pulls in the web stack.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
ui = [
    "nicegui>=2.24,<3",
]
web = [
    "httpx>=0.27",
]
deepseek = [
    "openai>=1.40",
]
# embedding: the real local semantic model (intfloat/multilingual-e5-small).
#   Weights are downloaded once at runtime and never stored in the .memory file;
#   the default install keeps using the keyword path and CI stays offline.
# vec: optional sqlite-vec acceleration for the vector index. The pure-Python
#   fallback means this is never required.
embedding = [
    "sentence-transformers>=2.7",
]
vec = [
    "sqlite-vec>=0.1",
]
# tts: optional independent speech output (Phase A). Nothing in the core
#   imports dashscope/pyaudio until /tts on is enabled, so a default install
#   never connects to Alibaba Cloud or needs an audio device.
tts = [
    "dashscope>=1.20",
    "pyaudio>=0.2.14",
]

[project.scripts]
companion = "companion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
