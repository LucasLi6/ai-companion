[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-companion"
version = "0.0.0"
description = "AI Companion V0.0 — multi-person identity, event persistence, pluggable cognition, and recoverable memory jobs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "aiosqlite>=0.19",
    "pydantic>=2.5",
]

[project.optional-dependencies]
# dev: test tooling.  ui: the NiceGUI management web app.  web: the real HTTP
# search client. The core runtime depends only on `dependencies` above, so a
# headless install never pulls in the web stack.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
ui = [
    "nicegui>=2.24,<3",
]
web = [
    "httpx>=0.27",
]
deepseek = [
    "openai>=1.40",
]

[project.scripts]
companion = "companion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
