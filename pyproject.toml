[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-companion"
version = "0.0.0"
description = "AI Companion V0.0 — multi-person identity, event persistence, pluggable cognition, and recoverable memory jobs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "aiosqlite>=0.19",
    "pydantic>=2.5",
    # The REPL input line is owned by prompt_toolkit on a TTY, so a proactive
    # message can be printed above live input without touching a Readline
    # buffer from another thread. Off-TTY runs fall back to plain input().
    "prompt-toolkit>=3.0,<4",
]

[project.optional-dependencies]
# dev: test tooling.  ui: the NiceGUI management web app.  web: the real HTTP
# search client. The core runtime depends only on `dependencies` above, so a
# headless install never pulls in the web stack.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # The offline tests for the voice-print matcher/store/quality and the ASR
    # VAD use NumPy directly. CI installs `.[dev,ui,web]` and must not need the
    # heavy `speaker` extra (torch/ModelScope) just to run the fake-embedding
    # tests, so the small wheel belongs here.
    "numpy>=1.26",
]
ui = [
    "nicegui>=2.24,<3",
]
web = [
    "httpx>=0.27",
]
deepseek = [
    "openai>=1.40",
]
# embedding: the real local semantic model (intfloat/multilingual-e5-small).
#   Weights are downloaded once at runtime and never stored in the .memory file;
#   the default install keeps using the keyword path and CI stays offline.
# vec: optional sqlite-vec acceleration for the vector index. The pure-Python
#   fallback means this is never required.
embedding = [
    "sentence-transformers>=2.7",
]
vec = [
    "sqlite-vec>=0.1",
]
# tts: optional independent speech output (Phase A/B). Nothing in the core
#   imports dashscope/pyaudio until TTS is enabled. Speech is on by default in
#   the REPL (AVA_TTS_ENABLED=false disables it); no Alibaba connection is made
#   until the first reply that actually produces speech, and a missing
#   dependency or audio device degrades to text-only.
tts = [
    "dashscope>=2.0.1",
    "pyaudio>=0.2.14",
]
# asr: optional independent real-time recognition demo. Nothing in the core
#   or in TTS imports these packages; `python -m companion.asr.demo` needs
#   them only when it actually runs. Silero VAD runs on CPU through ONNX
#   Runtime and the silero-vad package ships the model file; audio is resampled
#   with the standard library (audioop on Python <=3.12, a stateful linear
#   fallback on 3.13+).
asr = [
    "dashscope>=2.0.1",
    "pyaudio>=0.2.14",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "silero-vad>=5.1",
]
# speaker: optional local speaker identification for the independent ASR demo
#   (V0.9.9.22). The architecture and weights come from the pinned ModelScope
#   package/revision (3D-Speaker ERes2NetV2); no GitHub code is fetched at
#   runtime. Nothing in the core or the plain ASR demo imports these packages,
#   so a headless install never pulls in PyTorch. CPU is the default backend;
#   MPS is tried only when explicitly requested and falls back to CPU.
#   Versions below were installed together and exercised end to end with the
#   real checkpoint (load, warmup, encode). torch/torchaudio must stay on the
#   same release: this index has no torch 2.11.1 to pair with torchaudio
#   2.11.1, and other combinations fail to import. addict/datasets/pillow/
#   simplejson/sortedcontainers are imported by modelscope.pipelines in 1.40.2
#   but are not declared as hard dependencies, so they are listed here.
speaker = [
    "modelscope==1.40.2",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "numpy>=1.26",
    "soundfile>=0.12",
    "addict>=2.4",
    "datasets>=4.0,<6",
    "pillow>=9",
    "simplejson>=3.3.0",
    "sortedcontainers>=1.5.9",
]
# bargein: optional WebRTC AEC3 echo cancellation for real-time barge-in while
#   Ava speaks. Strictly additive: without this extra, or if the package does
#   not load, the REPL keeps its existing half-duplex voice behaviour and never
#   runs VAD on raw microphone audio during playback.
bargein = [
    "pywebrtc-audio>=0.2,<0.3",
]

[project.scripts]
companion = "companion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
